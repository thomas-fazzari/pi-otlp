min_version = "2026.9.0"

[tools]
bun = "1.4.4"
lefthook = "2.2.2"

[env]
LGTM_IMAGE = "grafana/otel-lgtm:0.38.0"
LGTM_NAME = "lgtm"
LGTM_GRAFANA_PORT = "3000"
LGTM_OTLP_PORT = "4318"
LGTM_DATA = "{{env.HOME}}/.local/share/otel-lgtm"
LGTM_RETENTION = "1y"

[task_config]
includes = ["scripts"]

[tasks.install]
description = "Dependencies from the lockfile and the Git hooks"
run = ["bun install --frozen-lockfile", "lefthook install"]

[tasks.quickstart]
description = "Starts the local otel-lgtm and installs this extension in Pi"
depends = ["lgtm"]
run = 'pi install "{{config_root}}"'

[tasks.fmt]
description = "Adds missing license headers, formats every file and fixes Markdown lint"
usage = 'flag "--check" help="Only report the files that differ"'
run = '''
if [ "$usage_check" = true ]; then
  scripts/license-headers.pl --check
  bunx --bun oxfmt --check .
  bunx --bun markdownlint-cli2
  exit
fi
scripts/license-headers.pl
bunx --bun oxfmt --write .
bunx --bun markdownlint-cli2 --fix
'''

[tasks.lint]
description = "Type-aware oxlint"
run = "bunx --bun oxlint --deny-warnings --report-unused-disable-directives"

[tasks.typecheck]
description = "TypeScript type check"
run = "bunx --bun tsc"

[tasks.test]
description = "Tests through bun test"
run = "bun test --pass-with-no-tests"

[tasks.e2e]
description = "End-to-end scenarios against a real Pi and grafana/otel-lgtm in Docker"
run = "bun test/e2e/run.ts"

[tasks.check]
description = "Every formatting, lint, type and test check"
depends = ["fmt --check", "lint", "typecheck", "test"]
run = "lefthook validate"
