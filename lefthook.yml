glob_matcher: doublestar

pre-commit:
  jobs:
    - name: oxfmt
      glob: "**/*.{md,json,jsonc,yml,yaml,toml,js,mjs,ts}"
      run: bunx --bun oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "**/*.md"
      run: bunx --bun markdownlint-cli2 --no-globs --fix {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commit-type
      run: perl scripts/commit-msg.pl {1}

pre-push:
  jobs:
    - name: check
      run: mise run check
