version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      bun-minor-patch:
        update-types:
          - minor
          - patch
